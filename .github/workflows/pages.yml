name: Refresh data and publish site

on:
  push:
    branches: [master]
  schedule:
    - cron: "23 11 * * *" # daily, ~3:23 am Seattle time
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Fetch SDOT, Project Sidewalk and OpenStreetMap data
        run: ruby scripts/fetch.rb
      - name: Build corners and site data
        run: ruby scripts/build.rb
      - name: Citywide hotspot scan
        run: ruby scripts/hotspots.rb --refresh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
