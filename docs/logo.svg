<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Trebuche: a curb cut seen from the street, with a yellow warning band, under a sunny or starry sky">
  <!-- A curb cut seen from the street at ground level: the concrete curb face
       with a wide, shallow cut sloping down to street level, and the yellow
       detectable-warning panel at the foot of the ramp. From this low angle the
       panel lies nearly flat, so its truncated domes show in profile, as bumps.
       The curb is drawn about twice as tall as it is relative to a real ramp's
       width so the shape still reads at browser-tab size. A faint gradient
       in the cut hints at the ramp surface rising away from the street. The sky
       follows the viewer's color scheme: sunny and blue in light mode, starry
       in dark mode (an embedded prefers-color-scheme media query). -->
  <defs>
    <linearGradient id="day" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7fd0"/>
      <stop offset="0.6" stop-color="#5aa6e4"/>
    </linearGradient>
    <radialGradient id="sun-glow">
      <stop offset="0" stop-color="#fff6c9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff6c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1226"/>
      <stop offset="0.6" stop-color="#1c2a48"/>
    </linearGradient>
    <style>
      .night { display: none; }
      @media (prefers-color-scheme: dark) { .day { display: none; } .night { display: inline; } }
    </style>
    <linearGradient id="ramp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8a8576" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8a8576" stop-opacity="0"/>
    </linearGradient><clipPath id="badge"><rect width="64" height="64" rx="14"/></clipPath></defs>
  <g clip-path="url(#badge)">
    <!-- sky: sunny in light mode, starry in dark mode (follows the viewer's setting) -->
    <g class="day">
      <rect width="64" height="64" fill="url(#day)"/>
      <circle cx="47" cy="13" r="11" fill="url(#sun-glow)"/>
      <circle cx="47" cy="13" r="5.2" fill="#ffd23f"/>
    </g>
    <g class="night">
      <rect width="64" height="64" fill="url(#night)"/>
      <circle cx="8" cy="7" r="0.75" fill="#fff" fill-opacity="0.95"/><circle cx="17" cy="15" r="0.5" fill="#fff" fill-opacity="0.7"/><circle cx="26" cy="5" r="0.6" fill="#fff" fill-opacity="0.85"/><circle cx="33" cy="12" r="0.45" fill="#fff" fill-opacity="0.6"/><circle cx="41" cy="6" r="0.8" fill="#fff" fill-opacity="1"/><circle cx="50" cy="16" r="0.5" fill="#fff" fill-opacity="0.7"/><circle cx="57" cy="9" r="0.6" fill="#fff" fill-opacity="0.85"/><circle cx="12" cy="22" r="0.45" fill="#fff" fill-opacity="0.55"/><circle cx="46" cy="22" r="0.5" fill="#fff" fill-opacity="0.6"/><circle cx="22" cy="10" r="0.4" fill="#fff" fill-opacity="0.5"/><circle cx="36" cy="20" r="0.4" fill="#fff" fill-opacity="0.5"/><circle cx="59" cy="19" r="0.45" fill="#fff" fill-opacity="0.55"/>
    </g>
    <!-- street -->
    <rect y="40" width="64" height="24" fill="#3a4a40"/>
    <!-- curb face, with the cut sloping down to the street -->
    <path d="M0 29H12L20 40H44L52 29H64V40H0Z" fill="#d6cfbd"/>
    <!-- ramp surface rising away from the street -->
    <path d="M12 29H52L45.89 37.4H18.11Z" fill="url(#ramp)"/>
    <path d="M18.11 37.40H45.89L44 40H20Z" fill="#f4c542"/>
    <!-- domes in profile -->
    <g fill="#f4c542"><circle cx="20.06" cy="37.40" r="1.15"/><circle cx="24.04" cy="37.40" r="1.15"/><circle cx="28.02" cy="37.40" r="1.15"/><circle cx="32.00" cy="37.40" r="1.15"/><circle cx="35.98" cy="37.40" r="1.15"/><circle cx="39.96" cy="37.40" r="1.15"/><circle cx="43.94" cy="37.40" r="1.15"/></g>
  </g>
</svg>
