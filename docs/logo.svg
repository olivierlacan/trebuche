<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Trebuche: a curb cut with a check mark engraved in it">
  <!-- Three-quarter view of a curb cut: the sidewalk (yellow) with its curb
       face (dark yellow) above the street (gray-green). The ramp is the same
       concrete as the sidewalk, defined by its sloped side flares and the notch
       it makes in the curb face. A check mark is engraved in the deep part of
       the cut: a dark groove with a light lower edge. -->
  <defs><clipPath id="badge"><rect width="64" height="64" rx="14"/></clipPath></defs>
  <g clip-path="url(#badge)">
    <rect width="64" height="64" fill="#1f2a24"/>
    <!-- sidewalk top -->
    <rect y="9" width="64" height="31" fill="#f4c542"/>
    <!-- curb face -->
    <rect y="40" width="64" height="9" fill="#9c7a1c"/>
    <!-- street -->
    <rect y="49" width="64" height="15" fill="#3a4a40"/>
    <!-- the cut: ramp down to the street, with sloped side flares -->
    <path d="M22 18H42L44 49H20Z" fill="#f4c542"/>
    <path d="M9 40L22 18L20 49Z" fill="#d6ab2c"/>
    <path d="M55 40L42 18L44 49Z" fill="#d6ab2c"/>
    <!-- engraved check mark -->
    <g fill="none" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M25.6 39.4L30.4 44.4L38.8 32.8" stroke="#fde9a6" transform="translate(0.7 0.8)"/>
      <path d="M25.6 39.4L30.4 44.4L38.8 32.8" stroke="#8c6c14"/>
    </g>
  </g>
</svg>
