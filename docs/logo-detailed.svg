<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Trebuche: a curb ramp with a yellow warning panel, footprints and wheel tracks">
  <!-- Three-quarter view of a curb ramp: concrete sidewalk and curb face above
       the street, the ramp cut through the curb with sloped side flares, and a
       yellow detectable-warning panel (truncated domes in a grid) across the
       foot of the ramp, as on most Seattle ramps. Semi-transparent shoe prints
       and wheel tracks (wheelchairs, strollers) show people using the ramp. -->
  <defs>
    <clipPath id="badge"><rect width="64" height="64" rx="14"/></clipPath>

    <!-- tread textures: prints are made of ridges, not solid fills -->
    <pattern id="sole-tread" width="1" height="1.05" patternUnits="userSpaceOnUse">
      <rect width="1" height="0.6" fill="#000"/>
    </pattern>
    <pattern id="tire-tread" width="0.95" height="0.95" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="0.48" height="0.95" fill="#000"/>
    </pattern>
  </defs>
  <g clip-path="url(#badge)">
    <rect width="64" height="64" fill="#1f2a24"/>
    <!-- sidewalk -->
    <rect y="9" width="64" height="31" fill="#e7e1d2"/>
    <!-- curb face -->
    <rect y="40" width="64" height="9" fill="#b3aa94"/>
    <!-- street -->
    <rect y="49" width="64" height="15" fill="#3a4a40"/>
    <!-- ramp and side flares -->
    <path d="M22 18H42L44 49H20Z" fill="#e7e1d2"/>
    <path d="M9 40L22 18L20 49Z" fill="#d2cab7"/>
    <path d="M55 40L42 18L44 49Z" fill="#d2cab7"/>
    <!-- detectable-warning panel -->
    <path d="M20.48 41.6H43.52L44.00 49H20.00Z" fill="#f4c542"/>
    <g fill="#c0920f"><circle cx="21.99" cy="43.0" r="0.62"/><circle cx="24.85" cy="43.0" r="0.62"/><circle cx="27.71" cy="43.0" r="0.62"/><circle cx="30.57" cy="43.0" r="0.62"/><circle cx="33.43" cy="43.0" r="0.62"/><circle cx="36.29" cy="43.0" r="0.62"/><circle cx="39.15" cy="43.0" r="0.62"/><circle cx="42.01" cy="43.0" r="0.62"/><circle cx="21.85" cy="45.2" r="0.68"/><circle cx="24.75" cy="45.2" r="0.68"/><circle cx="27.65" cy="45.2" r="0.68"/><circle cx="30.55" cy="45.2" r="0.68"/><circle cx="33.45" cy="45.2" r="0.68"/><circle cx="36.35" cy="45.2" r="0.68"/><circle cx="39.25" cy="45.2" r="0.68"/><circle cx="42.15" cy="45.2" r="0.68"/><circle cx="21.70" cy="47.5" r="0.74"/><circle cx="24.64" cy="47.5" r="0.74"/><circle cx="27.58" cy="47.5" r="0.74"/><circle cx="30.53" cy="47.5" r="0.74"/><circle cx="33.47" cy="47.5" r="0.74"/><circle cx="36.42" cy="47.5" r="0.74"/><circle cx="39.36" cy="47.5" r="0.74"/><circle cx="42.30" cy="47.5" r="0.74"/></g>
    <!-- marks of people using the ramp: shoe prints and wheel tracks (wheelchairs, strollers),
         drawn as tread textures that break up and fade downhill, so they read as prints
         left on the surface rather than grooves in it -->
    <path d="M-0.2 -4C1.1 -4 1.4 -3.1 1.3 -2.1C1.2 -1 0.7 -0.4 0.8 0.6C0.9 1.4 1.7 2 1.7 3C1.7 4 0.9 4.5 -0.1 4.5C-1.2 4.5 -1.9 3.8 -1.8 2.7C-1.7 1.6 -1.3 0.6 -1.35 -0.6C-1.4 -1.8 -1.5 -2.6 -1.4 -3.1C-1.25 -3.8 -0.9 -4 -0.2 -4Z" transform="translate(25.3 23.6) scale(0.70 0.70)" fill="url(#sole-tread)" fill-opacity="0.42"/>
    <path d="M-0.2 -4C1.1 -4 1.4 -3.1 1.3 -2.1C1.2 -1 0.7 -0.4 0.8 0.6C0.9 1.4 1.7 2 1.7 3C1.7 4 0.9 4.5 -0.1 4.5C-1.2 4.5 -1.9 3.8 -1.8 2.7C-1.7 1.6 -1.3 0.6 -1.35 -0.6C-1.4 -1.8 -1.5 -2.6 -1.4 -3.1C-1.25 -3.8 -0.9 -4 -0.2 -4Z" transform="translate(29.1 29.6) scale(-0.78 0.78)" fill="url(#sole-tread)" fill-opacity="0.34"/>
    <path d="M-0.2 -4C1.1 -4 1.4 -3.1 1.3 -2.1C1.2 -1 0.7 -0.4 0.8 0.6C0.9 1.4 1.7 2 1.7 3C1.7 4 0.9 4.5 -0.1 4.5C-1.2 4.5 -1.9 3.8 -1.8 2.7C-1.7 1.6 -1.3 0.6 -1.35 -0.6C-1.4 -1.8 -1.5 -2.6 -1.4 -3.1C-1.25 -3.8 -0.9 -4 -0.2 -4Z" transform="translate(25.1 36.0) scale(0.86 0.86)" fill="url(#sole-tread)" fill-opacity="0.26"/>
    <path d="M33.65 20.0H35.15L35.23 23.4H33.73Z" fill="url(#tire-tread)" fill-opacity="0.42"/>
    <path d="M33.75 24.3H35.25L35.37 29.1H33.87Z" fill="url(#tire-tread)" fill-opacity="0.36"/>
    <path d="M33.89 29.8H35.39L35.43 31.6H33.93Z" fill="url(#tire-tread)" fill-opacity="0.31"/>
    <path d="M33.96 32.7H35.46L35.56 37.0H34.06Z" fill="url(#tire-tread)" fill-opacity="0.27"/>
    <path d="M34.08 37.9H35.58L35.65 40.4H34.15Z" fill="url(#tire-tread)" fill-opacity="0.22"/>
    <path d="M38.15 20.0H39.65L39.87 24.1H38.37Z" fill="url(#tire-tread)" fill-opacity="0.42"/>
    <path d="M38.41 24.9H39.91L40.06 27.6H38.56Z" fill="url(#tire-tread)" fill-opacity="0.36"/>
    <path d="M38.60 28.5H40.10L40.35 33.2H38.85Z" fill="url(#tire-tread)" fill-opacity="0.31"/>
    <path d="M38.90 34.0H40.40L40.53 36.4H39.03Z" fill="url(#tire-tread)" fill-opacity="0.26"/>
    <path d="M39.08 37.4H40.58L40.74 40.4H39.24Z" fill="url(#tire-tread)" fill-opacity="0.22"/>
  </g>
</svg>
